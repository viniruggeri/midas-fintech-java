spring:
  # Configuração do Oracle para produção
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521:xe}
    username: ${ORACLE_USER:midas_user}
    password: ${ORACLE_PASSWORD:midas_password}
    driver-class-name: oracle.jdbc.OracleDriver

  # Configuração do JPA para Oracle
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

# Logging para produção
logging:
  level:
    org.hibernate.SQL: WARN
    root: INFO
