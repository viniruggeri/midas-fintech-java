spring:
  datasource:
    url: jdbc:h2:mem:midasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

  h2:
    console:
      enabled: false

# Em Azure, JWT_SECRET deve ser definido via Application Settings.
# Para OAuth2 GitHub em Azure, definir nas Application Settings:
# GITHUB_OAUTH2_CLIENT_ID, GITHUB_OAUTH2_CLIENT_SECRET,
# SECURITY_OAUTH2_GITHUB_ENABLED=true e SECURITY_OAUTH2_ADMIN_GITHUB_LOGINS.

logging:
  level:
    com.fiap.midasfintech: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    root: WARN

