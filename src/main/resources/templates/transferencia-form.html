<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transferência</title>
    <style>
      body {
        font-family: Verdana, sans-serif;
        margin: 0;
        background: #f7fafc;
      }
      .container {
        max-width: 700px;
        margin: 24px auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
      }
      label {
        display: block;
        margin: 10px 0 6px;
        font-weight: bold;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
      }
      button {
        margin-top: 12px;
        padding: 10px 14px;
        background: #184d47;
        border: 0;
        color: #fff;
        cursor: pointer;
      }
      .msg {
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 12px;
      }
      .erro {
        background: #ffe8e8;
        color: #a52222;
      }
      .ok {
        background: #e7f8ea;
        color: #1f7a2d;
      }
      .field-erro {
        color: #a52222;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Transferência entre contas</h2>

      <div th:if="${error}" class="msg erro" th:text="${error}"></div>
      <div th:if="${success}" class="msg ok" th:text="${success}"></div>

      <form
        th:action="@{/cliente/transferencia}"
        th:object="${transferenciaForm}"
        method="post"
      >
        <label for="contaOrigemId">Conta de origem</label>
        <select id="contaOrigemId" th:field="*{contaOrigemId}">
          <option value="">Selecione...</option>
          <option
            th:each="conta : ${contas}"
            th:value="${conta.id}"
            th:text="${conta.nome + ' - Saldo: ' + conta.saldo}"
          ></option>
        </select>
        <div
          class="field-erro"
          th:if="${#fields.hasErrors('contaOrigemId')}"
          th:errors="*{contaOrigemId}"
        ></div>

        <label for="contaDestinoId">Conta de destino</label>
        <select id="contaDestinoId" th:field="*{contaDestinoId}">
          <option value="">Selecione...</option>
          <option
            th:each="conta : ${contas}"
            th:value="${conta.id}"
            th:text="${conta.nome + ' - Saldo: ' + conta.saldo}"
          ></option>
        </select>
        <div
          class="field-erro"
          th:if="${#fields.hasErrors('contaDestinoId')}"
          th:errors="*{contaDestinoId}"
        ></div>

        <label for="valor">Valor</label>
        <input
          id="valor"
          type="number"
          step="0.01"
          min="0.01"
          th:field="*{valor}"
        />
        <div
          class="field-erro"
          th:if="${#fields.hasErrors('valor')}"
          th:errors="*{valor}"
        ></div>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" rows="3" th:field="*{descricao}"></textarea>

        <button type="submit">Confirmar transferência</button>
      </form>

      <p style="margin-top: 16px">
        <a th:href="@{/cliente/dashboard}">Voltar para dashboard</a>
      </p>
    </div>
  </body>
</html>
