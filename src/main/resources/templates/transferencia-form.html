<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transferência</title>
    <link rel="stylesheet" th:href="@{/css/midas-ui.css}" />
  </head>
  <body>
    <main class="page-shell" style="max-width: 820px">
      <section class="topbar">
        <div>
          <span class="badge">Fluxo do Cliente</span>
          <h1 class="hero-title" style="margin-top: 8px">Transferência entre contas</h1>
          <p class="subtitle">Validações automáticas de saldo, conta de origem e conta de destino.</p>
        </div>
        <a class="btn btn-secondary btn-link" th:href="@{/cliente/dashboard}">Voltar ao dashboard</a>
      </section>

      <section class="card">
        <div class="card-body">
          <div th:if="${error}" class="msg erro" th:text="${error}"></div>
          <div th:if="${success}" class="msg ok" th:text="${success}"></div>

          <form th:action="@{/cliente/transferencia}" th:object="${transferenciaForm}" method="post">
            <div class="field">
              <label for="contaOrigemId">Conta de origem</label>
              <select id="contaOrigemId" th:field="*{contaOrigemId}">
                <option value="">Selecione...</option>
                <option
                  th:each="conta : ${contas}"
                  th:value="${conta.id}"
                  th:text="${conta.nome + ' - Saldo: ' + conta.saldo}"
                ></option>
              </select>
              <div
                class="field-erro"
                th:if="${#fields.hasErrors('contaOrigemId')}"
                th:errors="*{contaOrigemId}"
              ></div>
            </div>

            <div class="field">
              <label for="contaDestinoId">Conta de destino</label>
              <select id="contaDestinoId" th:field="*{contaDestinoId}">
                <option value="">Selecione...</option>
                <option
                  th:each="conta : ${contas}"
                  th:value="${conta.id}"
                  th:text="${conta.nome + ' - Saldo: ' + conta.saldo}"
                ></option>
              </select>
              <div
                class="field-erro"
                th:if="${#fields.hasErrors('contaDestinoId')}"
                th:errors="*{contaDestinoId}"
              ></div>
            </div>

            <div class="grid grid-2">
              <div class="field">
                <label for="valor">Valor</label>
                <input id="valor" type="number" step="0.01" min="0.01" th:field="*{valor}" />
                <div class="field-erro" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></div>
              </div>
              <div class="field">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" rows="3" th:field="*{descricao}"></textarea>
              </div>
            </div>

            <button class="btn btn-primary" type="submit">Confirmar transferência</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
