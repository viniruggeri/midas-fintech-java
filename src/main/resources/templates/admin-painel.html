<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Admin</title>
    <link rel="stylesheet" th:href="@{/css/midas-ui.css}" />
  </head>
  <body>
    <main class="page-shell">
      <section class="topbar">
        <div>
          <span class="badge">Admin</span>
          <h1 class="hero-title" style="margin-top: 8px">Painel Administrativo</h1>
          <p class="subtitle">Acompanhe movimentações e execute estorno com trilha de auditoria.</p>
        </div>
        <div class="actions">
          <a class="btn btn-secondary btn-link" th:href="@{/cliente/dashboard}">Ir para visão cliente</a>
          <form th:action="@{/logout}" method="post" style="margin: 0">
            <button type="submit">Sair</button>
          </form>
        </div>
      </section>

      <section class="card" style="margin-bottom: 16px">
        <div class="card-body">
          <h2 class="section-title">Executar estorno</h2>
          <div th:if="${error}" class="msg erro" th:text="${error}"></div>
          <div th:if="${success}" class="msg ok" th:text="${success}"></div>

          <form th:action="@{/admin/estorno}" th:object="${estornoForm}" method="post">
            <div class="grid grid-2">
              <div class="field">
                <label for="transacaoId">ID da transação</label>
                <input id="transacaoId" type="number" th:field="*{transacaoId}" />
                <div class="field-erro" th:if="${#fields.hasErrors('transacaoId')}" th:errors="*{transacaoId}"></div>
              </div>

              <div class="field">
                <label for="motivo">Motivo</label>
                <input id="motivo" type="text" th:field="*{motivo}" />
                <div class="field-erro" th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}"></div>
              </div>
            </div>

            <button class="btn btn-danger" type="submit">Executar estorno</button>
          </form>
        </div>
      </section>

      <section class="card">
        <div class="card-body">
          <h2 class="section-title">Últimas transações</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Conta</th>
                  <th>Tipo</th>
                  <th>Valor</th>
                  <th>Data</th>
                  <th>Descrição</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="tx : ${transacoes}">
                  <td th:text="${tx.id}">1</td>
                  <td th:text="${tx.account.nome}">Conta</td>
                  <td th:text="${tx.tipo}">RECEITA</td>
                  <td th:text="${tx.valor}">0.00</td>
                  <td th:text="${tx.data}">2026-01-01T10:00</td>
                  <td th:text="${tx.descricao}">descricao</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
