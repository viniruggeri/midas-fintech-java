spring:
  profiles:
    active: dev
  application:
    name: midas-api
  artemis:
    mode: embedded
    embedded:
      enabled: true
      persistent: false
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_OAUTH2_CLIENT_ID:midas-disabled-client-id}
            client-secret: ${GITHUB_OAUTH2_CLIENT_SECRET:midas-disabled-client-secret}
            scope:
              - read:user
              - user:email
        provider:
          github:
            user-name-attribute: login

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-with-32-chars-minimum}
    previous-secrets: ${JWT_PREVIOUS_SECRETS:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  auth:
    rate-limit:
      max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:10}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  oauth2:
    github-enabled: ${SECURITY_OAUTH2_GITHUB_ENABLED:false}
    admin-github-logins: ${SECURITY_OAUTH2_ADMIN_GITHUB_LOGINS:}

midas:
  messaging:
    estorno-queue: ${MIDAS_ESTORNO_QUEUE:estorno.notificacao.queue}
  notification:
    base-url: ${MIDAS_NOTIFICATION_BASE_URL:http://localhost:${server.port:8080}}

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId:-no-req}] %-5level %logger{36} - %msg%n"
  level:
    com.fiap.midasfintech: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
